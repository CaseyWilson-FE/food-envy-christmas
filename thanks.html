<style>
:root { --brand-black:#000; --brand-green:#05B085; --brand-beige:#F1EAE0; --brand-white:#fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Work Sans', system-ui, sans-serif; background: var(--brand-beige); color: var(--brand-black); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 20px; line-height: 1.55; }
.card { background: var(--brand-white); max-width: 560px; width: 100%; padding: 48px 32px; border-radius: 10px; text-align: center; }
.tick { width: 56px; height: 56px; border-radius: 50%; background: var(--brand-green); margin: 0 auto 24px; position: relative; }
.tick::after { content: ""; position: absolute; left: 19px; top: 17px; width: 18px; height: 10px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: rotate(-45deg); }
h1 { font-size: 30px; font-weight: 600; margin-bottom: 14px; }
p { font-size: 17px; color: rgba(0,0,0,.72); margin-bottom: 12px; }
a.btn { display: inline-block; margin-top: 20px; background: var(--brand-green); color: #fff; text-decoration: none; font-weight: 600; padding: 14px 26px; border-radius: 6px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick"></div>
    <h1>Thanks, we've got it</h1>
    <p>Our events team will be in touch within one business day with a menu and quote for your Christmas function.</p>
    <p>Need us sooner? Call <a href="tel:+6442420080">04 242 0080</a>.</p>
    <a class="btn" href="https://www.foodenvy.nz">Back to foodenvy.nz</a>
  </div>
</body>
